<!-- =====================================================
     SISTEMA UNB - ACHADOS E PERDIDOS
     Página de Notificações
===================================================== -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- ==================================================
         CONFIGURAÇÕES BÁSICAS DA PÁGINA
    =================================================== -->

    <meta charset="UTF-8">

    <!-- Permite que a página seja responsiva em
         dispositivos móveis e tablets -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Título exibido na aba do navegador -->
    <title>
        Notificações - UnB - Achados e Perdidos
    </title>

    <!-- ==================================================
         BOOTSTRAP
         Framework CSS utilizado para layout,
         responsividade e componentes visuais
    =================================================== -->
    <link rel="stylesheet" href="/css/navbar.css">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- ==================================================
         ARQUIVO CSS PERSONALIZADO
         Contém os estilos específicos da página
         de notificações
    =================================================== -->

    <link
        rel="stylesheet"
        href="/css/notificacoes.css">

</head>

<body>

    <!-- ==================================================
         BARRA DE NAVEGAÇÃO SUPERIOR
    =================================================== -->

    <nav class="navbar navbar-dark navbar-unb">

        <div class="container d-flex justify-content-between align-items-center position-relative">

            <!-- Botão Feed -->
            <a
                href="/html/index.html"
                class="btn btn-light">

                Feed

            </a>

            <!-- Logo + nome -->
            <div class="position-absolute start-50 translate-middle-x d-flex align-items-center">

                <img
                    src="/logo_unb.png"
                    class="unb-logo-nav"
                    alt="Logo UnB">

                <a
                    href="/html/index.html"
                    class="navbar-brand nav-brand-text text-white m-0 ms-2">

                    UnB - Achados e Perdidos

                </a>

            </div>

            <!-- Botão Perfil -->
            <a
                href="/html/perfil.html"
                class="btn btn-light">

                Perfil

            </a>

        </div>

    </nav>

    <!-- ==================================================
         CONTEÚDO PRINCIPAL DA PÁGINA
    =================================================== -->

    <div class="container mt-4">

        <!-- Título da seção de notificações -->
        <h2 class="mb-4">

            🔔 Notificações

        </h2>

        <!-- ==============================================
             LISTA DE NOTIFICAÇÕES

             Este elemento será preenchido
             dinamicamente pelo JavaScript.
        =============================================== -->

        <div id="listaNotificacoes"></div>

    </div>

    <!-- ==================================================
         SCRIPT DA PÁGINA

         Responsável por:
         - Carregar notificações
         - Exibir mensagens recebidas
         - Informar mudanças de status
         - Atualizar a interface dinamicamente
    =================================================== -->

    <script src="/js/config.js"></script>
    <script src="/js/notificacoes.js"></script>

</body>

</html>

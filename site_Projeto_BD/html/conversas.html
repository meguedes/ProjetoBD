<!DOCTYPE html>

<html lang="pt-BR">
<head>


<!-- ===================================================== -->
<!-- CONFIGURAÇÕES BÁSICAS DA PÁGINA -->
<!-- ===================================================== -->

<!-- Define o conjunto de caracteres utilizado -->
<meta charset="UTF-8">

<!-- Permite responsividade em dispositivos móveis -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Título exibido na aba do navegador -->
<title>Conversa - UnB - Achados e Perdidos</title>

<!-- Framework Bootstrap para estilização da interface -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Arquivo CSS responsável pelos estilos da conversa -->
<link rel="stylesheet" href="/css/navbar.css">
<link rel="stylesheet" href="/css/conversas.css">
```

</head>

<body>

```
<!-- ===================================================== -->
<!-- BARRA DE NAVEGAÇÃO (NAVBAR) -->
<!-- ===================================================== -->

<nav class="navbar navbar-dark navbar-unb">

    <div class="container d-flex justify-content-between align-items-center">

        <!-- Botão Feed -->
        <a
            href="/html/index.html"
            class="btn btn-light">

            Feed

        </a>

        <!-- Logo + nome -->
        <div class="position-absolute start-50 translate-middle-x d-flex align-items-center">

            <img
                src="/logo_unb.png"
                class="unb-logo-nav"
                alt="Logo UnB">

            <a
                href="/html/index.html"
                class="navbar-brand nav-brand-text text-white m-0 ms-2">

                UnB - Achados e Perdidos

            </a>

        </div>

        <!-- Botão Perfil -->
        <a
            href="/html/perfil.html"
            class="btn btn-light">

            Perfil

        </a>

    </div>

</nav>

<!-- ===================================================== -->
<!-- CONTAINER PRINCIPAL DA CONVERSA -->
<!-- ===================================================== -->

<div class="container mt-4">

    <!-- Título da conversa -->
    <!-- Futuramente poderá ser preenchido dinamicamente -->
    <!-- com o nome do objeto relacionado à postagem -->
    <h2>💬 Conversas </h2>

    <!-- ================================================= -->
    <!-- ÁREA DE EXIBIÇÃO DAS MENSAGENS -->
    <!-- As mensagens serão inseridas dinamicamente pelo JS -->
    <!-- ================================================= -->

    <div
        id="chatBox"
        class="chat-box">

    </div>

    <!-- ================================================= -->
    <!-- FORMULÁRIO DE ENVIO DE MENSAGENS -->
    <!-- ================================================= -->

    <form id="mensagemForm">

        <div class="input-group mt-3">

            <!-- Campo de texto para digitação da mensagem -->

            <input
                type="text"
                id="mensagem"
                class="form-control"
                placeholder="Digite sua mensagem">

            <!-- Botão responsável pelo envio da mensagem -->

            <button
                class="btn btn-success">

                Enviar

            </button>

        </div>

    </form>

</div>

<!-- ===================================================== -->
<!-- ARQUIVO JAVASCRIPT -->
<!-- Responsável por carregar e enviar mensagens -->
<!-- ===================================================== -->

<script src="/js/config.js"></script>
<script src="/js/conversas.js"></script>



</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">
<head>

```
<!-- ===================================================== -->
<!-- CONFIGURAÇÕES BÁSICAS DA PÁGINA -->
<!-- ===================================================== -->

<!-- Define o conjunto de caracteres utilizado -->
<meta charset="UTF-8">

<!-- Permite responsividade em dispositivos móveis -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Título exibido na aba do navegador -->
<title>UnB - Achados e Perdidos - Cadastro Usuário</title>

<!-- Framework Bootstrap para estilização da interface -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Arquivo CSS personalizado da página -->
<link rel="stylesheet" href="/css/navbar.css">
<link rel="stylesheet" href="/css/cadastro_usuario.css">
```

</head>

<body>

```
<!-- ===================================================== -->
<!-- BARRA DE NAVEGAÇÃO (NAVBAR) -->
<!-- ===================================================== -->

    <nav class="navbar navbar-dark navbar-unb">

        <div class="container d-flex justify-content-between align-items-center position-relative">

            <!-- Botão Feed -->
            <a
                href="/html/index.html"
                class="btn btn-light">

                Feed

            </a>

            <!-- Logo + nome -->
            <div class="position-absolute start-50 translate-middle-x d-flex align-items-center">

                <img
                    src="/logo_unb.png"
                    class="unb-logo-nav"
                    alt="Logo UnB">

                <a
                    href="/html/index.html"
                    class="navbar-brand nav-brand-text text-white m-0 ms-2">

                    UnB - Achados e Perdidos

                </a>

            </div>

            <!-- Botão Perfil -->
            <a
                href="/html/perfil.html"
                class="btn btn-light">

                Perfil

            </a>

        </div>

    </nav>

<!-- ===================================================== -->
<!-- CONTAINER PRINCIPAL DA PÁGINA -->
<!-- ===================================================== -->

<div class="container">

    <!-- Card que contém o formulário de cadastro -->
    <div class="card card-cadastro">

        <div class="card-body p-4">

            <!-- Título principal da página -->
            <h2 class="mb-4">
                Cadastro de Usuário
            </h2>

            <!-- ===================================================== -->
            <!-- FORMULÁRIO DE CADASTRO -->
            <!-- ===================================================== -->

            <form id="cadastroForm">

                <!-- ===================================================== -->
                <!-- NOME COMPLETO -->
                <!-- ===================================================== -->

                <div class="mb-3">

                    <label>Nome Completo</label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        required>

                </div>

                <!-- ===================================================== -->
                <!-- E-MAIL -->
                <!-- Utilizado para login e comunicação -->
                <!-- ===================================================== -->

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>

                </div>

                <!-- ===================================================== -->
                <!-- CPF -->
                <!-- Identificador principal do usuário -->
                <!-- Corresponde à chave primária da tabela Usuario -->
                <!-- ===================================================== -->

                <div class="mb-3">

                    <label>CPF</label>

                    <input
                        type="text"
                        name="cpf"
                        class="form-control"
                        placeholder="000.000.000-00"
                        required>

                </div>

                <!-- ===================================================== -->
                <!-- REGISTRO INSTITUCIONAL -->
                <!-- Matrícula ou SIAPE do usuário -->
                <!-- ===================================================== -->

                <div class="mb-3">

                    <label>Registro Institucional</label>

                    <input
                        type="text"
                        name="registro"
                        class="form-control">

                </div>

                <!-- ===================================================== -->
                <!-- TELEFONE -->
                <!-- Utilizado para contato entre usuários -->
                <!-- ===================================================== -->

                <div class="mb-3">

                    <label>Telefone</label>

                    <input
                        type="tel"
                        name="telefone"
                        class="form-control">

                </div>

                <!-- ===================================================== -->
                <!-- TIPO DE USUÁRIO -->
                <!-- Define o vínculo do usuário com a UnB -->
                <!-- ===================================================== -->

                <div class="mb-3">

                    <label>Tipo de Usuário</label>

                    <select
                        class="form-select"
                        name="tipo_usuario"
                        required>

                        <option value="">
                            Selecione
                        </option>

                        <option>Aluno</option>
                        <option>Professor</option>
                        <option>Servidor</option>
                        <option>Visitante</option>

                    </select>

                </div>

                <!-- ===================================================== -->
                <!-- SENHA -->
                <!-- Utilizada para autenticação no sistema -->
                <!-- ===================================================== -->

                <div class="mb-3">

                    <label>Senha</label>

                    <input
                        type="password"
                        name="senha"
                        class="form-control"
                        required>

                </div>

                <!-- ===================================================== -->
                <!-- CONFIRMAÇÃO DE SENHA -->
                <!-- Verifica se a senha foi digitada corretamente -->
                <!-- ===================================================== -->

                <div class="mb-4">

                    <label>Confirmar Senha</label>

                    <input
                        type="password"
                        name="confirmar_senha"
                        class="form-control"
                        required>

                </div>

                <!-- ===================================================== -->
                <!-- BOTÃO DE CADASTRO -->
                <!-- Responsável por enviar os dados do usuário -->
                <!-- ===================================================== -->

                <button
                    type="submit"
                    class="btn btn-unb w-100">

                    Criar Conta

                </button>

            </form>

            <!-- Linha divisória entre cadastro e login -->
            <hr>

            <!-- ===================================================== -->
            <!-- LINK PARA LOGIN -->
            <!-- Exibido para usuários já cadastrados -->
            <!-- ===================================================== -->

            <p class="text-center">

                Já possui conta?

                <a href="/html/login.html">
                    Entrar
                </a>

            </p>

        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- ARQUIVO JAVASCRIPT -->
<!-- Responsável pelas validações e cadastro do usuário -->
<!-- ===================================================== -->

<script src="/js/cadastro_usuario.js"></script>


</body>

</html>

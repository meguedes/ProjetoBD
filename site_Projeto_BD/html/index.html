<!-- =====================================================
     SISTEMA UNB - ACHADOS E PERDIDOS
     Página principal do Feed de Publicações
====================================================== -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- ==================================================
         CONFIGURAÇÕES BÁSICAS DA PÁGINA
    =================================================== -->

    <meta charset="UTF-8">

    <!-- Responsividade para dispositivos móveis -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Título exibido na aba do navegador -->
    <title>
        UnB - Achados e Perdidos - Premium UI
    </title>

    <!-- ==================================================
         BOOTSTRAP
         Framework CSS utilizado para layout e componentes
    =================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- ==================================================
         GOOGLE FONTS
         Inter: textos gerais
         Syne: títulos e identidade visual
    =================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">

    <!-- ==================================================
         ARQUIVO CSS PERSONALIZADO
    =================================================== -->

    <link
        rel="stylesheet"
        href="/css/feed.css">

    <!-- Espaço reservado para CSS interno futuro -->
    <style>

    </style>

</head>

<body>

    <!-- ==================================================
         BARRA DE NAVEGAÇÃO SUPERIOR
    =================================================== -->

    <nav class="navbar navbar-dark custom-nav sticky-top">

        <div class="container feed-container py-0 d-flex justify-content-between align-items-center">

            <!-- Área da marca do sistema -->
            <div class="d-flex align-items-center">

                <!-- Logo da Universidade de Brasília -->
                <img
                    src="/logo_unb.png"
                    class="unb-logo-nav"
                    alt="Logo UnB">

                <!-- Nome do sistema -->
                <a
                    class="navbar-brand nav-brand-text text-white m-0"
                    href="#">

                    UnB - Achados e Perdidos

                </a>

            </div>

            <!-- ==========================================
                 Área dinâmica do usuário

                 Será preenchida pelo JavaScript com:
                 - Botão "Entrar"
                 ou
                 - Botão "Meu Perfil"
            =========================================== -->

            <div id="areaUsuario"></div>

        </div>

    </nav>

    <!-- ==================================================
         CONTAINER PRINCIPAL DO FEED

         O JavaScript adicionará dinamicamente
         os cards de objetos perdidos e encontrados.
    =================================================== -->

    <div
        id="container-feed"
        class="feed-container">

    </div>

    <!-- ==================================================
         SCRIPT PRINCIPAL

         Responsável por:
         - Carregar as publicações
         - Verificar login do usuário
         - Criar os cards dinamicamente
         - Exibir botões de contato
    =================================================== -->

    <script src="/js/feed.js"></script>

</body>

</html>

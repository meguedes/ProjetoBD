<!-- =====================================================
     SISTEMA UNB - ACHADOS E PERDIDOS
     Página de Perfil do Usuário
===================================================== -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- ==================================================
         CONFIGURAÇÕES BÁSICAS DA PÁGINA
    =================================================== -->

    <meta charset="UTF-8">

    <!-- Permite que a página seja responsiva em
         dispositivos móveis, tablets e computadores -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Título exibido na aba do navegador -->
    <title>
        Perfil - UnB - Achados e Perdidos
    </title>

    <!-- ==================================================
         BOOTSTRAP
         Framework utilizado para layout, componentes
         visuais e responsividade
    =================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- ==================================================
         ARQUIVO CSS PERSONALIZADO
         Responsável pela aparência da página de perfil
    =================================================== -->

    <link
        rel="stylesheet"
        href="/css/perfil.css">

</head>

<body>

    <!-- ==================================================
         BARRA DE NAVEGAÇÃO SUPERIOR
    =================================================== -->

    <nav class="navbar navbar-dark navbar-unb">

        <div class="container">

            <!-- Link para retornar à página inicial -->
            <a
                class="navbar-brand"
                href="/hmtl/index.html">

                UnB - Achados e Perdidos

            </a>

            <!-- Botão para encerrar a sessão do usuário -->
            <button
                class="btn btn-light"
                id="btnSair">

                Sair

            </button>

        </div>

    </nav>

    <!-- ==================================================
         CONTEÚDO PRINCIPAL DA PÁGINA
    =================================================== -->

    <div class="container mt-5">

        <!-- Cartão principal do perfil -->
        <div class="card perfil-card">

            <div class="card-body">

                <!-- ======================================
                     ÁREA DE IDENTIFICAÇÃO DO USUÁRIO
                ======================================= -->

                <div class="text-center">

                    <!-- Avatar do usuário -->
                    <div class="avatar">
                        👤
                    </div>

                    <!-- Nome carregado dinamicamente -->
                    <h2 id="nomeUsuario"></h2>

                </div>

                <hr>

                <!-- ======================================
                     DADOS CADASTRAIS
                ======================================= -->

                <p>
                    <strong>CPF:</strong>
                    <span id="cpfUsuario"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="emailUsuario"></span>
                </p>

                <p>
                    <strong>Telefone:</strong>
                    <span id="telefoneUsuario"></span>
                </p>

                <p>
                    <strong>Registro:</strong>
                    <span id="registroUsuario"></span>
                </p>

                <p>
                    <strong>Tipo:</strong>
                    <span id="tipoUsuario"></span>
                </p>

                <hr>

                <!-- ======================================
                     ESTATÍSTICAS DO USUÁRIO
                ======================================= -->

                <div class="row text-center">

                    <!-- Quantidade de postagens -->
                    <div class="col">

                        <h4>5</h4>

                        <small>
                            Postagens
                        </small>

                    </div>

                    <!-- Quantidade de objetos devolvidos -->
                    <div class="col">

                        <h4>3</h4>

                        <small>
                            Devolvidos
                        </small>

                    </div>

                    <!-- Quantidade de notificações -->
                    <div class="col">

                        <h4>2</h4>

                        <small>
                            Notificações
                        </small>

                    </div>

                </div>

                <hr>

                <!-- ======================================
                     MENU DE NAVEGAÇÃO DO USUÁRIO
                ======================================= -->

                <div class="d-grid gap-2">

                    <!-- Acessa o feed principal -->
                    <a
                        href="index.html"
                        class="btn btn-unb">

                        Ver Feed

                    </a>

                    <!-- Cadastra um novo objeto -->
                    <a
                        href="cadastro_objeto.html"
                        class="btn btn-unb">

                        Anunciar Objeto

                    </a>

                    <!-- Exibe as publicações do usuário -->
                    <a
                        href="minhas_postagens.html"
                        class="btn btn-unb">

                        Minhas Postagens

                    </a>

                    <!-- Acessa a central de notificações -->
                    <a
                        href="notificacoes.html"
                        class="btn btn-unb">

                        Notificações

                    </a>

                    <!-- Acessa as conversas do sistema -->
                    <a
                        href="/html/conversas.html"
                        class="btn btn-unb">

                        Conversas

                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- ==================================================
         SCRIPT DA PÁGINA

         Responsável por:
         - Carregar os dados do usuário
         - Preencher informações do perfil
         - Controlar o logout
         - Gerenciar a sessão do usuário
    =================================================== -->

    <script src="/js/perfil.js"></script>

</body>

</html>

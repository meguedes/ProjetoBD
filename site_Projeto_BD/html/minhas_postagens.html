<!DOCTYPE html>
<!-- Define que o documento utiliza HTML5 -->

<html lang="pt-BR">
<!-- Define o idioma principal da página como Português do Brasil -->

<head>

    <!-- Configura o conjunto de caracteres para UTF-8 -->
    <meta charset="UTF-8">

    <!-- Permite que a página seja responsiva em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título exibido na aba do navegador -->
    <title>Minhas Postagens - UnB - Achados e Perdidos</title>

    <!-- Importação do framework Bootstrap para estilização -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Importação da folha de estilos personalizada -->
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/minhas_postagens.css">

</head>

<body>

<!-- Barra de navegação superior -->
<nav class="navbar navbar-dark navbar-unb">

    <div class="container d-flex justify-content-between align-items-center position-relative">

        <!-- Botão Feed -->
        <a
            href="/html/index.html"
            class="btn btn-light">

            Feed

        </a>

        <!-- Logo + nome -->
        <div class="position-absolute start-50 translate-middle-x d-flex align-items-center">

            <img
                src="/logo_unb.png"
                class="unb-logo-nav"
                alt="Logo UnB">

            <a
                href="/html/index.html"
                class="navbar-brand nav-brand-text text-white m-0 ms-2">

                UnB - Achados e Perdidos

            </a>

        </div>

        <!-- Botão Perfil -->
        <a
            href="/html/perfil.html"
            class="btn btn-light">

            Perfil

        </a>

    </div>

</nav>

<!-- Container principal da página -->
<div class="container mt-4">

    <!-- Título da seção -->
    <h2 class="mb-4">
        📦 Minhas Postagens
    </h2>

    <!-- Área onde as postagens do usuário serão carregadas dinamicamente pelo JavaScript -->
    <div id="listaPostagens"></div>

</div>

<!-- Importação do arquivo JavaScript responsável pela lógica da página -->
<script src="/js/config.js"></script>
<script src="/js/minhas_postagens.js"></script>

</body>
</html>
